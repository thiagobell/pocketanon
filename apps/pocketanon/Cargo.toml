[package]
name = "pocketanon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PocketAnon desktop app (eframe/egui)"

[[bin]]
name = "pocketanon"
path = "src/main.rs"

[dependencies]
pocketanon-core = { workspace = true }
pocketanon-detect-rules = { workspace = true }
pocketanon-detect-gliner = { workspace = true }
pocketanon-documents = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
rfd = { workspace = true }
arboard = { workspace = true }
directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu"] }
image = { workspace = true }
