[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
# Fill in: shown in `cargo metadata`, embedded in the binary (CARGO_PKG_AUTHORS) and copied into the
# app bundle's copyright line by packaging/bundle.sh.
authors = ["Your Name <you@example.com>"]
homepage = "https://example.com/pocketanon"
repository = "https://example.com/pocketanon.git"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
pocketanon-core = { path = "crates/core" }
pocketanon-detect-gliner = { path = "crates/detect-gliner" }
pocketanon-detect-rules = { path = "crates/detect-rules" }
pocketanon-documents = { path = "crates/documents" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
regex = "1"
unicode-segmentation = "1"
proptest = "1"

# ui (apps/pocketanon)
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17"
arboard = { version = "3.6", default-features = false }
env_logger = "0.11"

# model detector (crates/detect-gliner)
gline-rs = "1.1"
orp = "1"
ort = { version = "=2.0.0-rc.9" }
ureq = { version = "3", default-features = false, features = ["rustls"] }
directories = "6"
tempfile = "3"

# Wordcraft (ADR-0002), pinned; only used by crates/documents.
wordcraft-doc = { git = "https://github.com/storytold/wordcraft", rev = "eae242176108d328c5dd81fbc10370c51ab90706" }
wordcraft-docx = { git = "https://github.com/storytold/wordcraft", rev = "eae242176108d328c5dd81fbc10370c51ab90706" }
wordcraft-formats = { git = "https://github.com/storytold/wordcraft", rev = "eae242176108d328c5dd81fbc10370c51ab90706" }
wordcraft-layout = { git = "https://github.com/storytold/wordcraft", rev = "eae242176108d328c5dd81fbc10370c51ab90706" }
wordcraft-render = { git = "https://github.com/storytold/wordcraft", rev = "eae242176108d328c5dd81fbc10370c51ab90706" }
# Same versions Wordcraft uses (crates/documents: TXT keeps its own encoding for exact round trips).
encoding_rs = "0.8"
chardetng = "1"

[profile.dev]
opt-level = 1
# Line tables only: full debuginfo for wgpu, naga, ort and Wordcraft costs several GB of disk.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
